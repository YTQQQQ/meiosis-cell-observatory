<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf2ee"><title>减数分裂观察室 · 细胞图谱</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="brandmark"><i></i><i></i><i></i><i></i></span>细胞图谱 <small>CELL ATLAS</small></div><nav><button data-nav="lab" class="current">观察室</button><button data-nav="compare">对照学习</button><button data-nav="quiz">判图练习</button></nav><button id="guide" class="book" aria-label="术语与教材说明">◎ <span>学习手册</span></button></header>
<main>
<div class="heading"><div><div class="eyebrow"><i></i> 生物学实验台 <b>/</b> 遗传与进化</div><h1>减数分裂观察室</h1><p>旋转细胞，追踪一条染色体经历的两次分裂。</p></div><div class="seg route"><button id="male" class="on">精子形成</button><button id="female">卵细胞形成</button></div></div>
<div class="layout"><section class="viewer" aria-label="动画播放器"><div class="stage" id="stage">
<canvas id="world" aria-label="可拖动旋转的三维细胞模型"></canvas><canvas id="map" hidden aria-label="同步教材图"></canvas><canvas id="labels" aria-hidden="true"></canvas>
<div class="screenhead"><div class="microlabel"><em></em><span id="screenName">结构预览</span></div><div class="darkseg"><button id="d3" class="on">三维</button><button id="d2">教材图</button></div></div>
<div class="stage-tools"><button id="restore" title="恢复标准视角" aria-label="恢复标准视角">⟲</button><button id="zoomIn" title="放大" aria-label="放大">＋</button><button id="zoomOut" title="缩小" aria-label="缩小">−</button><button id="settings" title="观察设置" aria-label="观察设置">☷</button><button id="fullscreen" title="全屏观察" aria-label="全屏观察" aria-pressed="false">⛶</button></div>
<div id="prefs" class="popover" hidden><b>观察设置</b><label>细胞膜透明度<input id="opacity" type="range" min="0" max="95" value="38"></label><label>剖开前侧细胞膜<input id="cut" type="checkbox"></label><label>结构标注<input id="showlabels" type="checkbox" checked></label><label>亲本来源色<input id="color" type="checkbox" checked></label><label>基因标记<input id="genes" type="checkbox"></label><button id="resetTrack">结束染色体追踪</button></div>
<div class="legend"><span><i class="blue"></i>父源</span><span><i class="red"></i>母源</span><span id="tracktag"></span></div><div class="compass" aria-hidden="true">Y<br>└─ X</div><canvas id="mini" hidden aria-label="全部细胞的位置预览"></canvas></div>
<div class="transport"><div class="progresshead"><b id="timeName"></b><button class="link" id="chapters">时期目录</button></div><input id="timeline" aria-label="教学时间轴" type="range" min="0" max="14" step=".001" value="0"><div class="ticks"><span>分裂准备</span><span>减数第一次分裂</span><span>减数第二次分裂</span><span>受精</span></div><div class="controls"><button id="play" class="primary">开始学习</button><button id="prev" title="上一阶段" aria-label="上一阶段">❮</button><button id="next" title="下一阶段" aria-label="下一阶段">❯</button><button id="restart" title="重新开始" aria-label="重新开始">↺</button><div class="right"><select id="mode" aria-label="播放模式"><option value="step">分步讲解</option><option value="auto">连续播放</option></select><select id="speed" aria-label="播放速度"><option>.25×</option><option>.5×</option><option selected>1×</option><option>2×</option><option>4×</option></select></div></div></div></section>
<aside><section class="card notes"><div class="cardhead"><b><i class="tabicon"></i>观察笔记</b><button id="speak" aria-label="朗读字幕">朗读</button></div><div class="phase" id="phase"></div><h2 id="lessonTitle"></h2><p id="event"></p><div class="why" id="why"></div><div class="noteactions"><button class="link" id="lens">拆开观察</button><button class="link dim" id="more">深入解释</button></div></section>
<section class="card countcard"><div class="cardhead"><b><i class="gridicon"></i>同步计数</b><button id="fold" aria-label="收起或展开计数">收起</button></div><div id="numbers"><div id="scopeName"></div><div id="stats"></div><canvas id="spark" aria-label="同步数量曲线，点击跳转" role="img"></canvas><div class="sparklegend"><span>染色体</span><span>核 DNA</span><span>染色单体</span><span>组数</span></div><button id="curve" class="link">查看数量曲线</button></div></section></aside>
<section class="workbench"><div><h2>遗传实验</h2><p id="expDesc" aria-live="polite"></p></div><div class="expcontrols"><button id="linked" class="experiment on">交叉互换</button><label id="expOption"><input id="experimentCheck" type="checkbox" checked> 一次互换</label><button id="arrangement" class="experiment">自由组合的另外一种情况</button><button id="results" class="link">查看产物</button></div></section></div>
<div class="foot"><span>模型 2n = 4 · 颜色用于区分来源　<a href="meiosis-source.zip" download>源码与运行说明</a></span><button id="focusBtn" class="link dim">选择细胞与追踪对象</button></div>
</main><dialog id="dialog"><div class="dialogtop"><h2 id="dialogTitle"></h2><button id="close" aria-label="关闭">✕</button></div><div id="dialogBody"></div></dialog>
<script src="lessons.js"></script><script src="model.js"></script><script src="optics.js"></script><script src="lens.js"></script><script src="diagram.js"></script><script src="app.js"></script></body></html>
